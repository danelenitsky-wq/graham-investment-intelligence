# Local PostgreSQL for development: `docker compose up -d db`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: graham
      POSTGRES_PASSWORD: graham_dev_pw
      POSTGRES_DB: graham_dev
    ports:
      - "127.0.0.1:5432:5432" # localhost only: never publish the database port
    volumes:
      - graham-pg:/var/lib/postgresql/data
volumes:
  graham-pg:
